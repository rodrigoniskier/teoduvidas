<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Apologética Reformada - Respostas Bíblicas para Dúvidas Sinceras">
    <title>Apologética Reformada</title>
    
    <style>
        /* ==========================================
           DESIGN SYSTEM - Modern 2026 Theme
           ========================================== */
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@700&display=swap');

        :root {
            /* Modern Color Palette - Deep Purple & Gold */
            --color-primary: #4a148c;
            --color-primary-light: #6a1b9a;
            --color-primary-dark: #38006b;
            --color-accent: #ffd700;
            --color-accent-dark: #ffb300;
            
            /* Glassmorphism Colors */
            --glass-bg: rgba(255, 255, 255, 0.15);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: rgba(0, 0, 0, 0.1);
            
            /* Background Gradient */
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --bg-pattern: radial-gradient(circle at 20% 50%, rgba(120, 119, 198, 0.3) 0%, transparent 50%),
                          radial-gradient(circle at 80% 80%, rgba(252, 196, 107, 0.2) 0%, transparent 50%);
            
            /* Neutrals */
            --color-text: #1a1a2e;
            --color-text-light: #4a4a68;
            --color-text-lighter: #7a7a9a;
            --color-card-bg: #ffffff;
            --color-card-back: #f8f9ff;
            --color-border: rgba(0, 0, 0, 0.08);
            --color-error: #e63946;
            
            /* Spacing */
            --space-xs: 0.25rem;
            --space-sm: 0.5rem;
            --space-md: 1rem;
            --space-lg: 1.5rem;
            --space-xl: 2rem;
            --space-2xl: 3rem;
            
            /* Typography */
            --font-family-base: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-family-display: 'Playfair Display', Georgia, serif;
            
            /* Border Radius */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 50px;
            
            /* Shadows - Layered for depth */
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.08);
            --shadow-md: 0 4px 16px rgba(0, 0, 0, 0.12);
            --shadow-lg: 0 8px 32px rgba(0, 0, 0, 0.16);
            --shadow-xl: 0 16px 48px rgba(0, 0, 0, 0.2);
            
            /* Transitions */
            --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-base: 250ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: 400ms cubic-bezier(0.4, 0, 0.2, 1);
            --transition-bounce: 600ms cubic-bezier(0.68, -0.55, 0.265, 1.55);
            
            /* Z-index */
            --z-sticky: 100;
            --z-modal: 1000;
        }

        /* ==========================================
           BASE STYLES
           ========================================== */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family-base);
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--color-text);
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: var(--bg-pattern);
            pointer-events: none;
            z-index: 0;
        }

        /* ==========================================
           HEADER - Glassmorphism Style
           ========================================== */
        .header {
            background: var(--glass-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border-bottom: 1px solid var(--glass-border);
            padding: var(--space-xl) var(--space-lg);
            text-align: center;
            position: sticky;
            top: 0;
            z-index: var(--z-sticky);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .header__title {
            font-family: var(--font-family-display);
            font-size: clamp(1.75rem, 5vw, 2.5rem);
            font-weight: 700;
            background: linear-gradient(135deg, #ffd700 0%, #ffffff 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: var(--space-sm);
            letter-spacing: -0.02em;
        }

        .header__subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: clamp(0.875rem, 2vw, 1rem);
            font-weight: 300;
            letter-spacing: 0.05em;
        }

        /* Search Bar - Modern Glass Style */
        .search {
            margin-top: var(--space-lg);
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            position: relative;
        }

        .search__input {
            width: 100%;
            padding: var(--space-md) var(--space-xl);
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(10px);
            border: 2px solid var(--glass-border);
            border-radius: var(--radius-full);
            font-size: 1rem;
            color: white;
            outline: none;
            transition: all var(--transition-base);
        }

        .search__input::placeholder {
            color: rgba(255, 255, 255, 0.7);
        }

        .search__input:focus {
            background: rgba(255, 255, 255, 0.35);
            border-color: var(--color-accent);
            box-shadow: 0 0 0 4px rgba(255, 215, 0, 0.2);
            transform: translateY(-2px);
        }

        /* ==========================================
           NAVIGATION
           ========================================== */
        .nav {
            padding: var(--space-lg) var(--space-xl);
            display: none;
            position: relative;
            z-index: 10;
        }

        .nav--visible {
            display: block;
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .nav__back-btn {
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            color: white;
            cursor: pointer;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: var(--space-sm);
            padding: var(--space-sm) var(--space-lg);
            border-radius: var(--radius-full);
            transition: all var(--transition-base);
            font-size: 0.95rem;
        }

        .nav__back-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateX(-4px);
        }

        /* ==========================================
           MAIN CONTENT
           ========================================== */
        .main {
            flex: 1;
            padding: var(--space-xl);
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            position: relative;
            z-index: 10;
        }

        /* ==========================================
           CATEGORIES GRID - Modern Card Design
           ========================================== */
        .categories {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: var(--space-xl);
            padding: var(--space-xl) 0;
        }

        .categories--hidden {
            display: none;
        }

        .category-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: var(--space-2xl);
            border-radius: var(--radius-xl);
            cursor: pointer;
            transition: all var(--transition-base);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: var(--shadow-md);
            position: relative;
            overflow: hidden;
        }

        .category-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: linear-gradient(90deg, var(--color-primary), var(--color-accent));
            transform: scaleX(0);
            transform-origin: left;
            transition: transform var(--transition-base);
        }

        .category-card:hover {
            transform: translateY(-8px);
            box-shadow: var(--shadow-xl);
            border-color: var(--color-accent);
        }

        .category-card:hover::before {
            transform: scaleX(1);
        }

        .category-card__title {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: var(--space-md);
            color: var(--color-primary);
            font-family: var(--font-family-display);
        }

        .category-card__desc {
            color: var(--color-text-light);
            line-height: 1.6;
        }

        /* ==========================================
           QUESTIONS VIEW
           ========================================== */
        .questions-view {
            display: none;
        }

        .questions-view--visible {
            display: block;
            animation: fadeIn 0.4s ease-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .questions-view__title {
            color: white;
            font-family: var(--font-family-display);
            font-size: clamp(1.75rem, 4vw, 2.5rem);
            margin-bottom: var(--space-2xl);
            text-align: center;
            text-shadow: 2px 4px 12px rgba(0, 0, 0, 0.3);
        }

        .questions-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: var(--space-xl);
        }

        /* ==========================================
           FLASHCARDS - Modern 3D Design (FIXED)
           ========================================== */
        .flashcard {
            perspective: 1500px;
            height: auto;
            min-height: 280px;
            cursor: pointer;
            position: relative;
        }

        .flashcard__inner {
            position: relative;
            width: 100%;
            min-height: 280px;
            transition: transform var(--transition-slow);
            transform-style: preserve-3d;
        }

        .flashcard--flipped .flashcard__inner {
            transform: rotateY(180deg);
        }

        .flashcard__face {
            position: absolute;
            width: 100%;
            min-height: 280px;
            backface-visibility: hidden;
            border-radius: var(--radius-lg);
            padding: var(--space-2xl);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: var(--shadow-lg);
            transition: box-shadow var(--transition-base);
        }

        .flashcard:hover .flashcard__face {
            box-shadow: var(--shadow-xl);
        }

        /* Front Face - Question */
        .flashcard__front {
            background: linear-gradient(135deg, #ffffff 0%, #f8f9ff 100%);
            border: 2px solid rgba(103, 58, 183, 0.1);
        }

        .flashcard__question {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--color-primary);
            line-height: 1.5;
            flex: 1;
            display: flex;
            align-items: center;
        }

        .flashcard__hint {
            font-size: 0.75rem;
            color: var(--color-text-lighter);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            margin-top: var(--space-lg);
            font-weight: 500;
        }

        .flashcard__hint::before {
            content: '↻';
            font-size: 1.25rem;
            animation: rotate 2s linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Back Face - Answer */
        .flashcard__back {
            background: linear-gradient(135deg, #f8f9ff 0%, #e8eaf6 100%);
            border: 2px solid rgba(255, 215, 0, 0.3);
            transform: rotateY(180deg);
        }

        .flashcard__answer {
            font-size: 1rem;
            line-height: 1.7;
            color: var(--color-text);
            flex: 1;
            overflow-y: auto;
            max-height: 200px;
            padding-right: var(--space-sm);
        }

        .flashcard__answer::-webkit-scrollbar {
            width: 4px;
        }

        .flashcard__answer::-webkit-scrollbar-thumb {
            background: var(--color-primary-light);
            border-radius: 10px;
        }

        .verse-section {
            margin-top: var(--space-lg);
            padding-top: var(--space-lg);
            border-top: 2px solid rgba(103, 58, 183, 0.1);
        }

        .verse-section__label {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--color-text-lighter);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: var(--space-sm);
            display: block;
        }

        .verse-btn {
            background: var(--color-primary);
            color: white;
            border: none;
            padding: var(--space-sm) var(--space-md);
            border-radius: var(--radius-sm);
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            margin-right: var(--space-sm);
            margin-top: var(--space-sm);
            transition: all var(--transition-fast);
            box-shadow: 0 2px 8px rgba(74, 20, 140, 0.3);
        }

        .verse-btn:hover {
            background: var(--color-accent);
            color: var(--color-primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(255, 215, 0, 0.4);
        }

        .verse-btn:active {
            transform: translateY(0);
        }

        /* ==========================================
           MODAL - Modern Overlay
           ========================================== */
        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: var(--z-modal);
            padding: var(--space-xl);
        }

        .modal--visible {
            display: flex;
            animation: modalFadeIn 0.3s ease-out;
        }

        @keyframes modalFadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        .modal__content {
            background: white;
            padding: var(--space-2xl);
            border-radius: var(--radius-xl);
            max-width: 600px;
            width: 100%;
            position: relative;
            box-shadow: var(--shadow-xl);
            animation: modalSlideIn 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            border: 3px solid var(--color-accent);
        }

        @keyframes modalSlideIn {
            from {
                transform: scale(0.9) translateY(20px);
                opacity: 0;
            }
            to {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
        }

        .modal__close {
            position: absolute;
            top: var(--space-lg);
            right: var(--space-lg);
            background: rgba(0, 0, 0, 0.05);
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--color-text-light);
            transition: all var(--transition-fast);
        }

        .modal__close:hover {
            background: var(--color-error);
            color: white;
            transform: rotate(90deg);
        }

        .modal__ref {
            font-weight: 700;
            color: var(--color-primary);
            font-size: 1.5rem;
            margin-bottom: var(--space-lg);
            display: block;
            font-family: var(--font-family-display);
        }

        .modal__text {
            font-style: italic;
            color: var(--color-text);
            line-height: 1.8;
            font-size: 1.1rem;
            padding: var(--space-lg);
            background: rgba(103, 58, 183, 0.05);
            border-radius: var(--radius-md);
            border-left: 4px solid var(--color-accent);
        }

        /* ==========================================
           FOOTER
           ========================================== */
        .footer {
            text-align: center;
            padding: var(--space-2xl);
            color: rgba(255, 255, 255, 0.8);
            margin-top: auto;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            position: relative;
            z-index: 10;
        }

        .footer__text {
            margin: var(--space-sm) 0;
            font-size: 0.9rem;
        }

        /* ==========================================
           LOADING & ERROR STATES
           ========================================== */
        .loading {
            text-align: center;
            padding: var(--space-2xl);
            color: white;
            font-size: 1.25rem;
        }

        .error {
            color: white;
            text-align: center;
            padding: var(--space-2xl);
            background: rgba(230, 57, 70, 0.9);
            border-radius: var(--radius-lg);
            margin: var(--space-xl) 0;
            box-shadow: var(--shadow-lg);
        }

        /* ==========================================
           RESPONSIVE DESIGN
           ========================================== */
        @media (max-width: 768px) {
            .main {
                padding: var(--space-md);
            }

            .header {
                padding: var(--space-lg) var(--space-md);
            }

            .category-card,
            .flashcard__face {
                padding: var(--space-lg);
            }

            .questions-grid {
                grid-template-columns: 1fr;
            }

            .flashcard__inner,
            .flashcard__face {
                min-height: 320px;
            }
        }

        /* ==========================================
           ACCESSIBILITY
           ========================================== */
        @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        :focus-visible {
            outline: 3px solid var(--color-accent);
            outline-offset: 2px;
        }

        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1 class="header__title">Apologética Reformada</h1>
        <p class="header__subtitle">Respostas Bíblicas para Dúvidas Sinceras</p>
        <div class="search">
            <label for="searchBox" class="sr-only">Pesquisar por tema, dúvida ou teologia</label>
            <input 
                type="search" 
                id="searchBox" 
                class="search__input"
                placeholder="🔍 Pesquisar por tema, dúvida ou teologia..."
                aria-label="Campo de busca"
                autocomplete="off"
            >
        </div>
    </header>

    <nav id="nav" class="nav" aria-label="Navegação principal">
        <button 
            class="nav__back-btn" 
            id="backBtn"
            aria-label="Voltar para categorias"
        >
            <span aria-hidden="true">←</span>
            <span>Voltar para Categorias</span>
        </button>
    </nav>

    <main class="main">
        <section id="categoriesView" class="categories" aria-label="Categorias de apologética">
            <div class="loading">⏳ Carregando conteúdo...</div>
        </section>

        <section id="questionsView" class="questions-view" aria-label="Perguntas e respostas">
            <h2 id="categoryTitle" class="questions-view__title">Título da Categoria</h2>
            <div id="cardsContainer" class="questions-grid"></div>
        </section>
    </main>

    <div id="verseModal" class="modal" role="dialog" aria-labelledby="modalRef" aria-modal="true">
        <div class="modal__content">
            <button 
                class="modal__close" 
                id="closeModal"
                aria-label="Fechar modal"
            >
                ×
            </button>
            <span id="modalRef" class="modal__ref">João 3:16</span>
            <p id="modalText" class="modal__text">Porque Deus amou o mundo...</p>
        </div>
    </div>

    <footer class="footer">
        <p class="footer__text">✝ Soli Deo Gloria ✝</p>
        <p class="footer__text">Desenvolvido com 💜 por <strong>Rodrigo Niskier</strong></p>
    </footer>

    <script type="module">
        // ==========================================
        // APP STATE MANAGEMENT
        // ==========================================
        const AppState = {
            data: null,
            currentView: 'categories',
            searchTerm: '',
            
            setData(data) {
                this.data = data;
            },
            
            setView(view) {
                this.currentView = view;
                this.updateUI();
            },
            
            setSearchTerm(term) {
                this.searchTerm = term;
            },
            
            updateUI() {
                const categoriesView = document.getElementById('categoriesView');
                const questionsView = document.getElementById('questionsView');
                const nav = document.getElementById('nav');
                
                if (this.currentView === 'categories') {
                    categoriesView.classList.remove('categories--hidden');
                    questionsView.classList.remove('questions-view--visible');
                    nav.classList.remove('nav--visible');
                } else {
                    categoriesView.classList.add('categories--hidden');
                    questionsView.classList.add('questions-view--visible');
                    nav.classList.add('nav--visible');
                }
            }
        };

        // ==========================================
        // DOM ELEMENTS
        // ==========================================
        const elements = {
            searchBox: document.getElementById('searchBox'),
            backBtn: document.getElementById('backBtn'),
            categoriesView: document.getElementById('categoriesView'),
            questionsView: document.getElementById('questionsView'),
            categoryTitle: document.getElementById('categoryTitle'),
            cardsContainer: document.getElementById('cardsContainer'),
            verseModal: document.getElementById('verseModal'),
            modalRef: document.getElementById('modalRef'),
            modalText: document.getElementById('modalText'),
            closeModal: document.getElementById('closeModal')
        };

        // ==========================================
        // DATA LOADING
        // ==========================================
        async function loadData() {
            try {
                const response = await fetch('conteudo_corrigido.json');
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }
                
                const data = await response.json();
                AppState.setData(data);
                renderCategories(data.categorias);
            } catch (error) {
                console.error('Erro ao carregar dados:', error);
                elements.categoriesView.innerHTML = `
                    <div class="error" role="alert">
                        <p><strong>⚠️ Erro ao carregar dados.</strong></p>
                        <p>Verifique se o arquivo JSON está na mesma pasta.</p>
                    </div>
                `;
            }
        }

        // ==========================================
        // RENDERING FUNCTIONS
        // ==========================================
        function renderCategories(categories) {
            if (!categories || categories.length === 0) {
                elements.categoriesView.innerHTML = '<p class="loading">Nenhuma categoria encontrada.</p>';
                return;
            }

            const fragment = document.createDocumentFragment();
            
            categories.forEach(category => {
                const card = createCategoryCard(category);
                fragment.appendChild(card);
            });
            
            elements.categoriesView.innerHTML = '';
            elements.categoriesView.appendChild(fragment);
        }

        function createCategoryCard(category) {
            const card = document.createElement('article');
            card.className = 'category-card';
            card.setAttribute('role', 'button');
            card.setAttribute('tabindex', '0');
            card.setAttribute('aria-label', `Abrir categoria: ${category.titulo}`);
            
            card.innerHTML = `
                <h3 class="category-card__title">${escapeHtml(category.titulo)}</h3>
                <p class="category-card__desc">${escapeHtml(category.descricao)}</p>
            `;
            
            const openCategory = () => handleCategoryClick(category.id);
            card.addEventListener('click', openCategory);
            card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    openCategory();
                }
            });
            
            return card;
        }

        function renderQuestions(questions) {
            if (!questions || questions.length === 0) {
                elements.cardsContainer.innerHTML = '<p class="loading">❌ Nenhuma pergunta encontrada.</p>';
                return;
            }

            const fragment = document.createDocumentFragment();
            
            questions.forEach((question, index) => {
                const card = createFlashcard(question, index);
                fragment.appendChild(card);
            });
            
            elements.cardsContainer.innerHTML = '';
            elements.cardsContainer.appendChild(fragment);
        }

        function createFlashcard(question, index) {
            const card = document.createElement('article');
            card.className = 'flashcard';
            card.setAttribute('role', 'button');
            card.setAttribute('tabindex', '0');
            card.setAttribute('aria-label', `Pergunta ${index + 1}: ${question.pergunta}`);
            
            const verseButtons = question.versiculos?.map(v => 
                `<button 
                    class="verse-btn" 
                    data-ref="${escapeHtml(v.ref)}" 
                    data-text="${escapeHtml(v.texto)}"
                    aria-label="Ver versículo ${v.ref}"
                >
                    📖 ${escapeHtml(v.ref)}
                </button>`
            ).join('') || '';
            
            card.innerHTML = `
                <div class="flashcard__inner">
                    <div class="flashcard__face flashcard__front">
                        <div class="flashcard__question">${escapeHtml(question.pergunta)}</div>
                        <div class="flashcard__hint" aria-live="polite">Clique para ver a resposta</div>
                    </div>
                    <div class="flashcard__face flashcard__back">
                        <div class="flashcard__answer">${escapeHtml(question.resposta)}</div>
                        ${verseButtons ? `
                            <div class="verse-section">
                                <span class="verse-section__label">📚 Textos-Prova</span>
                                <div>${verseButtons}</div>
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
            
            const toggleFlip = (e) => {
                if (e.target.classList.contains('verse-btn')) return;
                card.classList.toggle('flashcard--flipped');
            };
            
            card.addEventListener('click', toggleFlip);
            card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleFlip(e);
                }
            });
            
            return card;
        }

        // ==========================================
        // EVENT HANDLERS
        // ==========================================
        function handleCategoryClick(categoryId) {
            const category = AppState.data.categorias.find(c => c.id === categoryId);
            if (!category) return;

            AppState.setView('questions');
            elements.categoryTitle.textContent = category.titulo;
            renderQuestions(category.perguntas);
        }

        function handleBackClick() {
            AppState.setView('categories');
            elements.searchBox.value = '';
            AppState.setSearchTerm('');
            renderCategories(AppState.data.categorias);
        }

        function handleSearch(searchTerm) {
            const term = searchTerm.toLowerCase().trim();
            AppState.setSearchTerm(term);
            
            if (term.length < 2) {
                if (AppState.currentView === 'categories') {
                    renderCategories(AppState.data.categorias);
                }
                return;
            }

            const allQuestions = AppState.data.categorias.flatMap(c => c.perguntas);
            
            const filteredQuestions = allQuestions.filter(q => 
                q.pergunta.toLowerCase().includes(term) || 
                q.resposta.toLowerCase().includes(term)
            );

            AppState.setView('questions');
            elements.categoryTitle.textContent = `🔍 Resultados para "${term}"`;
            renderQuestions(filteredQuestions);
        }

        function handleVerseClick(ref, text) {
            elements.modalRef.textContent = ref;
            elements.modalText.textContent = text;
            elements.verseModal.classList.add('modal--visible');
            elements.closeModal.focus();
        }

        function handleModalClose(e) {
            if (e.target === elements.verseModal || 
                e.target === elements.closeModal ||
                (e.type === 'keydown' && e.key === 'Escape')) {
                elements.verseModal.classList.remove('modal--visible');
            }
        }

        // ==========================================
        // UTILITY FUNCTIONS
        // ==========================================
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function debounce(func, wait) {
            let timeout;
            return function executedFunction(...args) {
                const later = () => {
                    clearTimeout(timeout);
                    func(...args);
                };
                clearTimeout(timeout);
                timeout = setTimeout(later, wait);
            };
        }

        // ==========================================
        // EVENT LISTENERS
        // ==========================================
        elements.backBtn.addEventListener('click', handleBackClick);

        const debouncedSearch = debounce((term) => handleSearch(term), 300);
        elements.searchBox.addEventListener('input', (e) => {
            debouncedSearch(e.target.value);
        });

        elements.verseModal.addEventListener('click', handleModalClose);
        elements.closeModal.addEventListener('click', handleModalClose);
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') handleModalClose(e);
        });

        elements.cardsContainer.addEventListener('click', (e) => {
            if (e.target.classList.contains('verse-btn')) {
                e.stopPropagation();
                const ref = e.target.dataset.ref;
                const text = e.target.dataset.text;
                handleVerseClick(ref, text);
            }
        });

        // ==========================================
        // INITIALIZATION
        // ==========================================
        document.addEventListener('DOMContentLoaded', () => {
            loadData();
        });
    </script>
</body>
</html>
