<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Apologética Reformada</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700&display=swap');

    :root {
      /* Paleta clara: Azul, Laranja, Amarelo e Branco */
      --color-primary: #1e3a8a;        /* azul escuro */
      --color-primary-light: #2563eb;  /* azul vivo */
      --color-accent: #f97316;         /* laranja */
      --color-accent-soft: #fed7aa;    /* laranja claro */
      --color-highlight: #facc15;      /* amarelo */
      --color-bg: #f3f4f6;             /* fundo cinza bem claro */
      --color-surface: #ffffff;
      --color-surface-soft: #fefce8;   /* amarelo muito suave */
      --color-text: #111827;
      --color-text-soft: #4b5563;
      --color-border: #e5e7eb;
      --color-error: #dc2626;

      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 18px;
      --radius-xl: 24px;
      --radius-full: 999px;

      --shadow-sm: 0 2px 6px rgba(15, 23, 42, 0.06);
      --shadow-md: 0 6px 18px rgba(15, 23, 42, 0.08);
      --shadow-lg: 0 12px 30px rgba(15, 23, 42, 0.12);

      --space-xs: 0.25rem;
      --space-sm: 0.5rem;
      --space-md: 1rem;
      --space-lg: 1.5rem;
      --space-xl: 2rem;
      --space-2xl: 3rem;

      --transition-fast: 150ms ease-out;
      --transition-base: 220ms ease;
      --transition-slow: 350ms ease;

      --z-sticky: 100;
      --z-modal: 1000;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(circle at top left, #bfdbfe 0, transparent 55%),
                  radial-gradient(circle at bottom right, #fee2e2 0, transparent 55%),
                  var(--color-bg);
      color: var(--color-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* HEADER */

    .header {
      position: sticky;
      top: 0;
      z-index: var(--z-sticky);
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(148, 163, 184, 0.2);
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      padding: var(--space-lg) var(--space-md);
    }

    .header__inner {
      max-width: 1200px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: var(--space-md);
    }

    .header__title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.7rem, 4vw, 2.4rem);
      font-weight: 700;
      color: var(--color-primary);
      letter-spacing: -0.02em;
    }

    .header__subtitle {
      font-size: 0.9rem;
      color: var(--color-text-soft);
    }

    .search {
      margin-top: var(--space-sm);
      max-width: 520px;
      position: relative;
    }

    .search__input {
      width: 100%;
      padding: 0.9rem 1rem 0.9rem 2.5rem;
      border-radius: var(--radius-full);
      border: 1px solid var(--color-border);
      background: rgba(255, 255, 255, 0.9);
      font-size: 0.95rem;
      color: var(--color-text);
      box-shadow: var(--shadow-sm);
      outline: none;
      transition: border-color var(--transition-base), box-shadow var(--transition-base), transform var(--transition-fast);
    }

    .search__input::placeholder {
      color: #9ca3af;
    }

    .search__input:focus {
      border-color: var(--color-primary-light);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
      transform: translateY(-1px);
    }

    .search__icon {
      position: absolute;
      left: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      color: #9ca3af;
    }

    /* NAV */

    .nav {
      max-width: 1200px;
      margin: 0.5rem auto 0;
      padding: 0 var(--space-md);
      display: none;
    }

    .nav--visible {
      display: block;
    }

    .nav__back-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      padding: 0.4rem 0.9rem;
      border-radius: var(--radius-full);
      border: 1px solid var(--color-border);
      background: rgba(255, 255, 255, 0.9);
      color: var(--color-primary);
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      box-shadow: var(--shadow-sm);
      transition: background var(--transition-base), transform var(--transition-fast), box-shadow var(--transition-base);
    }

    .nav__back-btn:hover {
      background: var(--color-surface-soft);
      transform: translateY(-1px);
      box-shadow: var(--shadow-md);
    }

    /* MAIN LAYOUT */

    .main {
      flex: 1;
      max-width: 1200px;
      width: 100%;
      margin: 0 auto;
      padding: var(--space-xl) var(--space-md) var(--space-2xl);
    }

    /* CATEGORIES */

    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: var(--space-lg);
    }

    .categories--hidden {
      display: none;
    }

    .category-card {
      background: var(--color-surface);
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      border: 1px solid var(--color-border);
      box-shadow: var(--shadow-md);
      cursor: pointer;
      transition: transform var(--transition-base), box-shadow var(--transition-base), border-color var(--transition-base);
      position: relative;
      overflow: hidden;
    }

    .category-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(37,99,235,0.08), rgba(249,115,22,0.08));
      opacity: 0;
      transition: opacity var(--transition-base);
      pointer-events: none;
    }

    .category-card:hover {
      transform: translateY(-6px);
      box-shadow: var(--shadow-lg);
      border-color: var(--color-accent-soft);
    }

    .category-card:hover::before {
      opacity: 1;
    }

    .category-card__title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.25rem;
      color: var(--color-primary);
      margin-bottom: 0.4rem;
    }

    .category-card__desc {
      font-size: 0.9rem;
      color: var(--color-text-soft);
      line-height: 1.5;
    }

    /* QUESTIONS VIEW */

    .questions-view {
      display: none;
    }

    .questions-view--visible {
      display: block;
    }

    .questions-view__title {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: clamp(1.6rem, 3vw, 2.1rem);
      color: var(--color-primary);
      margin-bottom: var(--space-lg);
      text-align: center;
    }

    .questions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: var(--space-lg);
    }

    /* FLASHCARDS */

    .flashcard {
      perspective: 1400px;
      position: relative;
      min-height: 260px;
      cursor: pointer;
    }

    .flashcard__inner {
      position: relative;
      width: 100%;
      min-height: 260px;
      transition: transform var(--transition-slow);
      transform-style: preserve-3d;
    }

    .flashcard--flipped .flashcard__inner {
      transform: rotateY(180deg);
    }

    .flashcard__face {
      position: absolute;
      inset: 0;
      border-radius: var(--radius-lg);
      padding: var(--space-lg);
      background: var(--color-surface);
      box-shadow: var(--shadow-md);
      backface-visibility: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid var(--color-border);
    }

    .flashcard__front {
      background: linear-gradient(135deg, #ffffff, #eff6ff);
    }

    .flashcard__back {
      background: linear-gradient(135deg, #ffffff, #fffbeb);
      transform: rotateY(180deg);
    }

    .flashcard__question {
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--color-primary);
      line-height: 1.6;
      margin-bottom: var(--space-md);
    }

    .flashcard__hint {
      font-size: 0.75rem;
      color: var(--color-text-soft);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .flashcard__hint::before {
      content: "⟲";
      font-size: 1rem;
    }

    .flashcard__answer {
      font-size: 0.95rem;
      color: var(--color-text);
      line-height: 1.7;
      flex: 1;
      overflow-y: auto;
      max-height: 200px;
      padding-right: 0.25rem;
    }

    .flashcard__answer::-webkit-scrollbar {
      width: 4px;
    }

    .flashcard__answer::-webkit-scrollbar-thumb {
      background: var(--color-primary-light);
      border-radius: 999px;
    }

    .verse-section {
      margin-top: var(--space-md);
      padding-top: var(--space-sm);
      border-top: 1px dashed var(--color-border);
    }

    .verse-section__label {
      font-size: 0.75rem;
      font-weight: 600;
      color: var(--color-text-soft);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 0.25rem;
      display: block;
    }

    .verse-btn {
      border: none;
      background: var(--color-primary-light);
      color: #f9fafb;
      border-radius: var(--radius-full);
      padding: 0.35rem 0.75rem;
      font-size: 0.8rem;
      font-weight: 500;
      margin: 0.2rem 0.3rem 0 0;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25);
      transition: transform var(--transition-fast), box-shadow var(--transition-fast), background var(--transition-fast);
    }

    .verse-btn:hover {
      background: var(--color-accent);
      color: #111827;
      transform: translateY(-1px);
      box-shadow: 0 6px 14px rgba(249, 115, 22, 0.3);
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: var(--z-modal);
      padding: var(--space-md);
    }

    .modal--visible {
      display: flex;
    }

    .modal__content {
      background: var(--color-surface);
      border-radius: var(--radius-xl);
      padding: var(--space-xl);
      max-width: 560px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      position: relative;
      border: 1px solid var(--color-border);
    }

    .modal__close {
      position: absolute;
      top: 0.75rem;
      right: 0.75rem;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      border: none;
      background: #fee2e2;
      color: #b91c1c;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal__ref {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 1.3rem;
      color: var(--color-primary);
      margin-bottom: var(--space-sm);
      display: block;
    }

    .modal__text {
      font-size: 1rem;
      color: var(--color-text);
      line-height: 1.8;
      padding: var(--space-md);
      background: var(--color-surface-soft);
      border-radius: var(--radius-md);
      border-left: 4px solid var(--color-highlight);
      font-style: italic;
    }

    /* STATES */

    .loading {
      text-align: center;
      padding: var(--space-xl);
      color: var(--color-text-soft);
    }

    .error {
      text-align: center;
      padding: var(--space-xl);
      background: #fee2e2;
      color: #b91c1c;
      border-radius: var(--radius-lg);
      border: 1px solid #fecaca;
      box-shadow: var(--shadow-md);
    }

    /* FOOTER */

    .footer {
      border-top: 1px solid rgba(148, 163, 184, 0.3);
      padding: var(--space-lg) var(--space-md);
      text-align: center;
      font-size: 0.85rem;
      color: var(--color-text-soft);
      background: rgba(255, 255, 255, 0.7);
      backdrop-filter: blur(10px);
    }

    /* RESPONSIVO */

    @media (max-width: 768px) {
      .header__inner {
        gap: var(--space-sm);
      }

      .main {
        padding-top: var(--space-lg);
      }
    }

    /* Acessibilidade básica */

    :focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 2px;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <header class="header">
    <div class="header__inner">
      <div>
        <h1 class="header__title">Apologética Reformada</h1>
        <p class="header__subtitle">Respostas bíblicas e teologicamente robustas para dúvidas sinceras.</p>
      </div>
      <div class="search">
        <span class="search__icon">🔍</span>
        <label for="searchBox" class="sr-only">Pesquisar por tema, dúvida ou teologia</label>
        <input
          type="search"
          id="searchBox"
          class="search__input"
          placeholder="Pesquisar por tema, dúvida ou teologia..."
          autocomplete="off"
          aria-label="Campo de busca de perguntas"
        >
      </div>
    </div>
  </header>

  <nav id="nav" class="nav" aria-label="Navegação principal">
    <button id="backBtn" class="nav__back-btn">
      ← Voltar para categorias
    </button>
  </nav>

  <main class="main">
    <section id="categoriesView" class="categories" aria-label="Categorias de apologética">
      <div class="loading">Carregando conteúdo…</div>
    </section>

    <section id="questionsView" class="questions-view" aria-label="Perguntas e respostas">
      <h2 id="categoryTitle" class="questions-view__title">Título da categoria</h2>
      <div id="cardsContainer" class="questions-grid"></div>
    </section>
  </main>

  <div id="verseModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalRef">
    <div class="modal__content">
      <button id="closeModal" class="modal__close" aria-label="Fechar versículo">×</button>
      <span id="modalRef" class="modal__ref">João 3:16</span>
      <p id="modalText" class="modal__text">Porque Deus amou o mundo…</p>
    </div>
  </div>

  <footer class="footer">
    <p>Soli Deo Gloria • Desenvolvido por <strong>Rodrigo Niskier</strong></p>
  </footer>

  <script type="module">
    const AppState = {
      data: null,
      currentView: 'categories',
      searchTerm: '',
      setData(data) { this.data = data; },
      setView(view) { this.currentView = view; this.updateUI(); },
      setSearchTerm(term) { this.searchTerm = term; },
      updateUI() {
        const categoriesView = document.getElementById('categoriesView');
        const questionsView = document.getElementById('questionsView');
        const nav = document.getElementById('nav');
        if (this.currentView === 'categories') {
          categoriesView.classList.remove('categories--hidden');
          questionsView.classList.remove('questions-view--visible');
          nav.classList.remove('nav--visible');
        } else {
          categoriesView.classList.add('categories--hidden');
          questionsView.classList.add('questions-view--visible');
          nav.classList.add('nav--visible');
        }
      }
    };

    const elements = {
      searchBox: document.getElementById('searchBox'),
      backBtn: document.getElementById('backBtn'),
      categoriesView: document.getElementById('categoriesView'),
      questionsView: document.getElementById('questionsView'),
      categoryTitle: document.getElementById('categoryTitle'),
      cardsContainer: document.getElementById('cardsContainer'),
      verseModal: document.getElementById('verseModal'),
      modalRef: document.getElementById('modalRef'),
      modalText: document.getElementById('modalText'),
      closeModal: document.getElementById('closeModal')
    };

    async function loadData() {
      try {
        // Se você renomeou o arquivo, ajuste aqui:
        const response = await fetch('conteudo.json');
        if (!response.ok) throw new Error('Erro HTTP: ' + response.status);
        const data = await response.json();
        AppState.setData(data);
        renderCategories(data.categorias);
      } catch (err) {
        console.error(err);
        elements.categoriesView.innerHTML = `
          <div class="error">
            <p><strong>Erro ao carregar o conteúdo.</strong></p>
            <p>Confirme se <code>conteudo.json</code> está na mesma pasta do <code>index.html</code> e sirva via servidor (Live Server / http).</p>
          </div>
        `;
      }
    }

    function renderCategories(categories) {
      if (!categories || !categories.length) {
        elements.categoriesView.innerHTML = '<p class="loading">Nenhuma categoria encontrada.</p>';
        return;
      }
      const frag = document.createDocumentFragment();
      categories.forEach(cat => frag.appendChild(createCategoryCard(cat)));
      elements.categoriesView.innerHTML = '';
      elements.categoriesView.appendChild(frag);
    }

    function createCategoryCard(category) {
      const card = document.createElement('article');
      card.className = 'category-card';
      card.innerHTML = `
        <h3 class="category-card__title">${escapeHtml(category.titulo)}</h3>
        <p class="category-card__desc">${escapeHtml(category.descricao)}</p>
      `;
      card.addEventListener('click', () => handleCategoryClick(category.id));
      return card;
    }

    function renderQuestions(questions) {
      if (!questions || !questions.length) {
        elements.cardsContainer.innerHTML = '<p class="loading">Nenhuma pergunta encontrada.</p>';
        return;
      }
      const frag = document.createDocumentFragment();
      questions.forEach((q, i) => frag.appendChild(createFlashcard(q, i)));
      elements.cardsContainer.innerHTML = '';
      elements.cardsContainer.appendChild(frag);
    }

    function createFlashcard(question, index) {
      const card = document.createElement('article');
      card.className = 'flashcard';

      const verseButtons = (question.versiculos || [])
        .map(v => `
          <button class="verse-btn" data-ref="${escapeHtml(v.ref)}" data-text="${escapeHtml(v.texto)}">
            ${escapeHtml(v.ref)}
          </button>
        `).join('');

      card.innerHTML = `
        <div class="flashcard__inner">
          <div class="flashcard__face flashcard__front">
            <div class="flashcard__question">${escapeHtml(question.pergunta)}</div>
            <div class="flashcard__hint">Clique para ver a resposta</div>
          </div>
          <div class="flashcard__face flashcard__back">
            <div class="flashcard__answer">${escapeHtml(question.resposta)}</div>
            ${verseButtons ? `
              <div class="verse-section">
                <span class="verse-section__label">Textos‑prova</span>
                ${verseButtons}
              </div>
            ` : ''}
          </div>
        </div>
      `;

      const toggleFlip = (e) => {
        if (e.target.classList.contains('verse-btn')) return;
        card.classList.toggle('flashcard--flipped');
      };

      card.addEventListener('click', toggleFlip);
      return card;
    }

    function handleCategoryClick(id) {
      const cat = AppState.data.categorias.find(c => c.id === id);
      if (!cat) return;
      AppState.setView('questions');
      elements.categoryTitle.textContent = cat.titulo;
      renderQuestions(cat.perguntas);
    }

    function handleBackClick() {
      AppState.setView('categories');
      elements.searchBox.value = '';
      AppState.setSearchTerm('');
      renderCategories(AppState.data.categorias);
    }

    function handleSearch(term) {
      const t = term.toLowerCase().trim();
      AppState.setSearchTerm(t);
      if (t.length < 2) {
        if (AppState.currentView === 'categories') {
          renderCategories(AppState.data.categorias);
        }
        return;
      }
      const allQ = AppState.data.categorias.flatMap(c => c.perguntas);
      const filtered = allQ.filter(q =>
        q.pergunta.toLowerCase().includes(t) ||
        q.resposta.toLowerCase().includes(t)
      );
      AppState.setView('questions');
      elements.categoryTitle.textContent = `Resultados para "${term}"`;
      renderQuestions(filtered);
    }

    function handleVerseClick(ref, text) {
      elements.modalRef.textContent = ref;
      elements.modalText.textContent = text;
      elements.verseModal.classList.add('modal--visible');
    }

    function handleModalClose(e) {
      if (e.target === elements.verseModal || e.target === elements.closeModal) {
        elements.verseModal.classList.remove('modal--visible');
      }
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function debounce(fn, wait) {
      let t;
      return (...args) => {
        clearTimeout(t);
        t = setTimeout(() => fn(...args), wait);
      };
    }

    // event listeners
    elements.backBtn.addEventListener('click', handleBackClick);
    elements.cardsContainer.addEventListener('click', (e) => {
      if (e.target.classList.contains('verse-btn')) {
        e.stopPropagation();
        handleVerseClick(e.target.dataset.ref, e.target.dataset.text);
      }
    });
    elements.verseModal.addEventListener('click', handleModalClose);
    elements.closeModal.addEventListener('click', handleModalClose);

    const debouncedSearch = debounce(v => handleSearch(v), 300);
    elements.searchBox.addEventListener('input', (e) => debouncedSearch(e.target.value));

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        elements.verseModal.classList.remove('modal--visible');
      }
    });

    document.addEventListener('DOMContentLoaded', loadData);
  </script>
</body>
</html>
